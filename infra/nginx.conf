server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 16k;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location / { try_files $uri $uri/ =404; }
}
