name: Engineering checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python scripts/verify_upstream_strategy.py
      - run: node --check prototype/dist/app.js && node --check prototype/dist/research.js && node --check prototype/dist/gold.js
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --manifest-path execution/Cargo.toml
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Disposable CI database only; not a production secret.
      POSTGRES_PASSWORD: ci_disposable_research_only
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: python3 scripts/smoke_research.py
      - name: Capture diagnostics
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail=100
      - name: Stop disposable CI stack
        if: always()
        run: docker compose down
